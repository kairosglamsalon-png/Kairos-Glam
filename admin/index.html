<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salon Admin Dashboard</title>

<!-- Favicons -->
  <link href="https://kairosglamdubai.com/images/favicon.png" rel="icon">
  <link href="https://kairosglamdubai.com/images/apple-touch-icon.png" rel="apple-touch-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    background:linear-gradient(135deg,#0f172a 0%, #111827 40%, #1e293b 100%);
    min-height:100vh;
    padding:25px;
    color:#fff;
}

.dashboard{
    width:100%;
    margin:auto;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:28px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:28px;
}

.top-bar h1{
    font-size:34px;
    font-weight:800;
    color:#fff;
}

.top-bar h1 span{
    color:#b32025;
}

.logout-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:13px 24px;
    border-radius:14px;
    background:linear-gradient(135deg, #c72d2d, #f76e55);
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:0.35s ease;
}

.logout-btn:hover{
    transform:translateY(-3px);
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin-bottom:30px;
}

.stat-card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    padding:22px;
}

.stat-card h3{
    font-size:14px;
    font-weight:500;
    color:#cbd5e1;
    margin-bottom:12px;
}

.stat-card h2{
    font-size:30px;
    font-weight:700;
    color:#fff;
    letter-spacing:1px;
}

.table-wrapper{
    overflow-x:auto;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1200px;
}

table thead{
    background:rgba(255,255,255,0.06);
}

table th{
    padding:18px;
    text-align:left;
    font-size:13px;
    font-weight:600;
    color:#e2e8f0;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

table td{
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    color:#f8fafc;
    font-size:14px;
    vertical-align:middle;
}

table td:nth-child(5){
    vertical-align:top;
}

table tbody tr{
    transition:0.3s ease;
}

table tbody tr:hover{
    background:rgba(255,255,255,0.04);
}

/* =========================
   COLUMN WIDTH
========================= */

table th:nth-child(5),
table td:nth-child(5){
    width:360px;
    min-width:360px;
}

table th:nth-child(8),
table td:nth-child(8){
    width:240px;
}

/* =========================
   SERVICE TAGS
========================= */

.service-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
}

.tag{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:7px 12px;
    border-radius:999px;
    background:rgba(247,85,85,0.14);
    border:1px solid rgba(247,85,85,0.22);
    color:#ffd6d6;
    font-size:11px;
    font-weight:500;
    line-height:1.2;
    transition:0.3s ease;
}

.tag:hover{
    background:rgba(247,85,85,0.24);
    transform:translateY(-2px);
}

.more-tag{
    cursor:pointer;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:#ffffff;
}

.more-tag:hover{
    background:rgba(255,255,255,0.16);
}

.extra-services{
    display:none;
    margin-top:10px;
    gap:8px;
    flex-wrap:wrap;
    width:100%;
}

.extra-services.active{
    display:flex;
}

.no-service{
    color:#94a3b8;
    font-size:13px;
}

/* =========================
   MESSAGE BOX
========================= */

.message-box{
    max-width:260px;
    line-height:1.7;
    color:#cbd5e1;
    white-space:normal;
    word-break:break-word;
}

/* =========================
   DELETE BUTTON
========================= */

.delete-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ef4444,#dc2626);
    color:#fff;
    text-decoration:none;
    padding:11px 16px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    transition:0.35s ease;
}

.delete-btn:hover{
    transform:translateY(-2px);
}

.no-data{
    text-align:center;
    padding:50px;
    font-size:16px;
    color:#cbd5e1;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:768px){

    body{
        padding:12px;
    }

    .dashboard{
        padding:18px;
    }

    .top-bar{
        flex-direction:column;
        align-items:flex-start;
    }

    .top-bar h1{
        font-size:25px;
    }

    .logout-btn{
        width:100%;
    }

}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:992px){

    table{
        min-width:1000px;
    }

    .dashboard{
        padding:22px;
    }

    .top-bar h1{
        font-size:28px;
    }

}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .dashboard{
        padding:16px;
        border-radius:20px;
    }

    .top-bar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .top-bar h1{
        font-size:24px;
        line-height:1.3;
    }

    .logout-btn{
        width:100%;
        padding:14px;
        text-align:center;
    }

    .stats-grid{
        grid-template-columns:1fr;
        gap:14px;
    }

    .stat-card{
        padding:18px;
        border-radius:18px;
    }

    .stat-card h3{
        font-size:13px;
    }

    .stat-card h2{
        font-size:24px;
    }

    .table-wrapper{
        overflow-x:auto;
        border-radius:18px;
    }

    table{
        min-width:900px;
    }

    table th,
    table td{
        padding:14px;
        font-size:13px;
    }

    .message-box{
        max-width:220px;
        font-size:13px;
        line-height:1.6;
    }

    .tag{
        font-size:10px;
        padding:6px 10px;
    }

    .delete-btn{
        padding:10px 14px;
        font-size:12px;
        border-radius:10px;
    }

}

@media(max-width:480px){

    body{
        padding:8px;
    }

    .dashboard{
        padding:14px;
        border-radius:16px;
    }

    .top-bar h1{
        font-size:20px;
    }

    .logout-btn{
        font-size:13px;
        padding:12px;
    }

    .stat-card{
        padding:16px;
    }

    .stat-card h2{
        font-size:20px;
    }

    table{
        min-width:800px;
    }

    table th,
    table td{
        padding:12px;
        font-size:12px;
    }

    .message-box{
        max-width:180px;
        font-size:12px;
    }

    .tag{
        font-size:9px;
        padding:5px 9px;
    }

    .delete-btn{
        padding:9px 12px;
        font-size:11px;
    }

}

/* =========================
   BETTER MOBILE TABLE UI
========================= */

@media(max-width:768px){

    /* Date + Time Column */
    table td:nth-child(6),
    table td:nth-child(7){
        min-width:120px;
    }

    table td:nth-child(6) .tag,
    table td:nth-child(7) .tag{
        display:inline-block;
        width:100%;
        text-align:center;
        padding:8px 10px;
        border-radius:10px;
        font-size:11px;
        line-height:1.4;
    }

    /* Message Box */
    .message-box{
        min-width:220px;
        max-width:220px;
        background:rgba(255,255,255,0.04);
        border:1px solid rgba(255,255,255,0.06);
        padding:12px;
        border-radius:14px;
        font-size:12px;
        line-height:1.7;
        color:#e2e8f0;
    }

    /* Better table spacing */
    table td{
        vertical-align:top;
    }

}

@media(max-width:480px){

    table td:nth-child(6),
    table td:nth-child(7){
        min-width:100px;
    }

    table td:nth-child(6) .tag,
    table td:nth-child(7) .tag{
        font-size:10px;
        padding:7px 8px;
    }

    .message-box{
        min-width:180px;
        max-width:180px;
        padding:10px;
        font-size:11px;
        line-height:1.6;
    }

}

.table-wrapper::-webkit-scrollbar{
    height:6px;
}

.table-wrapper::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.05);
}

.table-wrapper::-webkit-scrollbar-thumb{
    background:#b32025;
    border-radius:20px;
}

.delete-btn{
    border:none;
    cursor:pointer;
    font-family:inherit;
}

.delete-btn:disabled{
    opacity:0.6;
    cursor:wait;
}

</style>

</head>


<body>

<div class="dashboard">

<div class="top-bar">

    <h1>
        Salon <span>Dashboard</span>
    </h1>

    <a class="logout-btn" href="/api/logout">
        Logout
    </a>

</div>

<div class="stats-grid">

    <div class="stat-card">
        <h3>Total Bookings</h3>
        <h2 id="totalBookings">–</h2>
    </div>

    <div class="stat-card">
        <h3>Today's Date</h3>
        <h2 id="todayDate"></h2>
    </div>

    <div class="stat-card">
        <h3>Current Time</h3>
        <h2 id="liveClock"></h2>
    </div>

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

    <th>ID</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Service</th>
    <th>Date</th>
    <th>Time</th>
    <th>Message</th>
    <th>Action</th>

</tr>

</thead>

<tbody id="bookingRows">

<tr>
<td colspan="9" class="no-data">Loading bookings...</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

function updateClock(){

    let now = new Date();

    let time = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    });

    document.getElementById("liveClock").textContent = time;

}

setInterval(updateClock, 1000);

updateClock();

document.getElementById("todayDate").textContent =
    new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

// Small helper to build elements with text only (never raw HTML).
function el(tag, className, text){

    const node = document.createElement(tag);

    if(className) node.className = className;
    if(text !== undefined) node.textContent = text;

    return node;

}

function messageRow(text){

    const tr = document.createElement("tr");
    const td = el("td", "no-data", text);

    td.colSpan = 9;
    tr.appendChild(td);

    return tr;

}

function serviceCell(service){

    const td = document.createElement("td");
    const services = (service || "").split(",").map(s => s.trim()).filter(Boolean);

    if(services.length === 0){
        td.appendChild(el("span", "no-service", "No Service"));
        return td;
    }

    const tags = el("div", "service-tags");
    services.slice(0, 4).forEach(s => tags.appendChild(el("span", "tag", s)));
    td.appendChild(tags);

    const remaining = services.slice(4);

    if(remaining.length > 0){

        const extra = el("div", "extra-services");
        remaining.forEach(s => extra.appendChild(el("span", "tag", s)));

        const more = el("span", "tag more-tag", "+" + remaining.length + " More");
        more.addEventListener("click", () => extra.classList.toggle("active"));

        tags.appendChild(more);
        td.appendChild(extra);

    }

    return td;

}

function bookingRow(row, serial){

    const tr = document.createElement("tr");

    tr.appendChild(el("td", "", serial));
    tr.appendChild(el("td", "", row.name));
    tr.appendChild(el("td", "", row.phone));
    tr.appendChild(el("td", "", row.email));
    tr.appendChild(serviceCell(row.service));

    const dateTd = document.createElement("td");
    dateTd.appendChild(el("span", "tag", row.booking_date || "-"));
    tr.appendChild(dateTd);

    const timeTd = document.createElement("td");
    timeTd.appendChild(el("span", "tag", row.booking_time || "-"));
    tr.appendChild(timeTd);

    const messageTd = el("td", "message-box", row.message || "");
    messageTd.style.whiteSpace = "pre-line";
    tr.appendChild(messageTd);

    const actionTd = document.createElement("td");
    const deleteBtn = el("button", "delete-btn", "Delete");
    deleteBtn.type = "button";
    deleteBtn.addEventListener("click", () => deleteBooking(row.id, deleteBtn));
    actionTd.appendChild(deleteBtn);
    tr.appendChild(actionTd);

    return tr;

}

async function loadBookings(){

    const tbody = document.getElementById("bookingRows");

    try{

        const res = await fetch("/api/bookings", { cache: "no-store" });

        if(res.status === 401){
            window.location.href = "/admin/login.html";
            return;
        }

        if(!res.ok) throw new Error("HTTP " + res.status);

        const { bookings } = await res.json();

        tbody.replaceChildren();
        document.getElementById("totalBookings").textContent = bookings.length;

        if(bookings.length === 0){
            tbody.appendChild(messageRow("No Bookings Found"));
            return;
        }

        bookings.forEach((row, i) => tbody.appendChild(bookingRow(row, i + 1)));

    }catch(err){

        tbody.replaceChildren(messageRow("Could not load bookings. Please refresh the page."));

    }

}

async function deleteBooking(id, button){

    if(!confirm("Are you sure you want to delete this booking?")) return;

    button.disabled = true;

    try{

        const res = await fetch("/api/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id })
        });

        if(res.status === 401){
            window.location.href = "/admin/login.html";
            return;
        }

        if(!res.ok) throw new Error("HTTP " + res.status);

        loadBookings();

    }catch(err){

        alert("Could not delete this booking. Please try again.");
        button.disabled = false;

    }

}

loadBookings();

</script>

</body>

</html>
