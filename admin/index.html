<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#faf5f3">

<title>Kairos Glam | Bookings Dashboard</title>

<!-- Favicons -->
  <link href="https://kairosglamdubai.com/images/favicon.png" rel="icon">
  <link href="https://kairosglamdubai.com/images/apple-touch-icon.png" rel="apple-touch-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

@font-face{
    font-family:'Kugile';
    src:url('/font/Kugile_Demo.ttf') format('truetype');
    font-display:swap;
}

:root{
    --brand:#b32025;
    --brand-light:#e0464b;
    --brand-soft:#fbeaea;
    --gold:#b8895a;
    --bg:#faf5f3;
    --card:#ffffff;
    --line:#ecdfdc;
    --text:#2b1b1c;
    --muted:#8a7472;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    -webkit-text-size-adjust:100%;
}

body{
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    color:var(--text);
    background:
    radial-gradient(ellipse 70% 40% at 50% -5%, rgba(179,32,37,0.10), transparent 70%),
    var(--bg);
    background-attachment:fixed;
    padding:28px 24px;
    padding-left:max(24px, env(safe-area-inset-left));
    padding-right:max(24px, env(safe-area-inset-right));
    padding-bottom:max(28px, env(safe-area-inset-bottom));
}

.dashboard{
    max-width:1280px;
    margin:0 auto;
}

/* =========================
   HEADER
========================= */

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
}

.brand img{
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line), 0 6px 16px rgba(179,32,37,0.16);
    flex-shrink:0;
}

.brand h1{
    font-family:'Kugile', 'Poppins', serif;
    font-weight:400;
    font-size:30px;
    color:var(--brand);
    line-height:1.1;
}

.brand p{
    font-size:13px;
    color:var(--muted);
}

.top-actions{
    display:flex;
    gap:10px;
    flex-shrink:0;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:44px;
    padding:0 18px;
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    text-decoration:none;
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.btn-ghost{
    background:#fff;
    color:var(--text);
    border:1px solid var(--line);
}

.btn-ghost:hover{
    border-color:#dcc8c4;
    background:#fffdfc;
}

.btn-primary{
    background:var(--brand);
    color:#fff;
    border:1px solid var(--brand);
}

.btn-primary:hover{
    background:#9d1b20;
}

.btn:focus-visible{
    outline:2px solid var(--brand-light);
    outline-offset:2px;
}

/* =========================
   STATS
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    margin-bottom:24px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 22px;
    box-shadow:0 8px 24px rgba(120,40,40,0.05);
}

.stat-card h3{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    margin-bottom:6px;
}

.stat-card h2{
    font-size:30px;
    font-weight:600;
    color:var(--text);
    line-height:1.2;
}

.stat-card.accent{
    background:linear-gradient(135deg, var(--brand), var(--brand-light));
    border-color:transparent;
    box-shadow:0 12px 28px rgba(179,32,37,0.22);
}

.stat-card.accent h3{
    color:rgba(255,255,255,0.85);
}

.stat-card.accent h2{
    color:#fff;
}

/* =========================
   TABLE PANEL
========================= */

.panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(120,40,40,0.06);
    overflow:hidden;
}

.panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
}

.panel-head h2{
    font-size:17px;
    font-weight:600;
}

.search{
    width:280px;
    max-width:100%;
    height:42px;
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fcf9f8;
    font-family:inherit;
    /* 16px stops iPhones from zooming in when the field is tapped */
    font-size:16px;
    color:var(--text);
    outline:none;
}

.search:focus{
    border-color:var(--brand-light);
    box-shadow:0 0 0 4px rgba(224,70,75,0.12);
    background:#fff;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#fcf7f6;
}

th{
    padding:14px 16px;
    text-align:left;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
}

td{
    padding:16px;
    border-top:1px solid var(--line);
    font-size:14px;
    vertical-align:top;
}

tbody tr:hover{
    background:#fffbfa;
}

.cell-name{
    font-weight:600;
}

.cell-sub{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    word-break:break-word;
}

.cell-contact a{
    color:var(--text);
    text-decoration:none;
}

.cell-contact a:hover{
    color:var(--brand);
}

.when{
    white-space:nowrap;
    font-weight:500;
}

/* =========================
   SERVICE TAGS
========================= */

.service-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.tag{
    display:inline-flex;
    align-items:center;
    padding:5px 10px;
    border-radius:999px;
    background:var(--brand-soft);
    color:#8f1a1e;
    font-size:12px;
    font-weight:500;
    line-height:1.3;
}

.more-tag{
    cursor:pointer;
    background:#f3ece9;
    color:var(--text);
    border:none;
    font-family:inherit;
}

.extra-services{
    display:none;
    flex-wrap:wrap;
    gap:6px;
    margin-top:6px;
}

.extra-services.active{
    display:flex;
}

.no-service{
    color:var(--muted);
    font-size:13px;
}

.message-box{
    max-width:280px;
    color:#5a4647;
    line-height:1.6;
    white-space:pre-line;
    word-break:break-word;
}

/* =========================
   DELETE BUTTON
========================= */

.delete-btn{
    height:38px;
    padding:0 14px;
    border-radius:10px;
    border:1px solid #f0c9ca;
    background:#fff;
    color:var(--brand);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.2s ease;
}

.delete-btn:hover{
    background:var(--brand-soft);
}

.delete-btn:disabled{
    opacity:0.6;
    cursor:wait;
}

.no-data{
    text-align:center;
    padding:48px 16px;
    font-size:15px;
    color:var(--muted);
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .stats-grid{
        gap:12px;
    }

    .stat-card{
        padding:16px;
    }

    .stat-card h2{
        font-size:24px;
    }

}

/* =========================
   PHONES: each booking becomes a card
========================= */

@media(max-width:760px){

    body{
        padding:16px;
        padding-top:max(16px, env(safe-area-inset-top));
    }

    .top-bar{
        margin-bottom:18px;
    }

    .brand{
        gap:10px;
    }

    .brand img{
        width:40px;
        height:40px;
    }

    .brand h1{
        font-size:22px;
        white-space:nowrap;
    }

    .brand p{
        font-size:12px;
        white-space:nowrap;
    }

    td.cell-serial{
        display:none;
    }

    td.cell-serial + td{
        border-top:none;
    }

    .btn{
        padding:0 12px;
        font-size:13px;
    }

    .btn .label-long{
        display:none;
    }

    .stats-grid{
        grid-template-columns:repeat(3, 1fr);
        gap:8px;
        margin-bottom:18px;
    }

    .stat-card{
        padding:12px;
        border-radius:14px;
    }

    .stat-card h3{
        font-size:11px;
        line-height:1.3;
    }

    .stat-card h2{
        font-size:22px;
    }

    .panel{
        background:transparent;
        border:none;
        box-shadow:none;
        overflow:visible;
    }

    .panel-head{
        flex-direction:column;
        align-items:stretch;
        padding:0 0 14px;
        border-bottom:none;
    }

    .search{
        width:100%;
    }

    thead{
        display:none;
    }

    table,
    tbody,
    tr,
    td{
        display:block;
        width:100%;
    }

    tbody tr{
        background:var(--card);
        border:1px solid var(--line);
        border-radius:16px;
        padding:6px 16px;
        margin-bottom:12px;
        box-shadow:0 6px 18px rgba(120,40,40,0.05);
    }

    tbody tr:hover{
        background:var(--card);
    }

    td{
        border-top:1px solid #f4ecea;
        padding:10px 0;
        display:grid;
        grid-template-columns:92px minmax(0, 1fr);
        gap:10px;
        align-items:start;
    }

    td:first-child{
        border-top:none;
    }

    td::before{
        content:attr(data-label);
        font-size:12px;
        min-width:0;
        font-weight:500;
        color:var(--muted);
        padding-top:2px;
    }

    td:last-child{
        grid-template-columns:1fr;
    }

    td:last-child::before{
        content:none;
    }

    td.no-data{
        display:block;
        border:none;
    }

    td.no-data::before{
        content:none;
    }

    tr.empty-row{
        border:1px dashed var(--line);
        box-shadow:none;
    }

    .message-box{
        max-width:none;
    }

    .delete-btn{
        width:100%;
        height:44px;
    }

}

@media (prefers-reduced-motion: reduce){

    *{
        transition:none !important;
    }

}

</style>

</head>

<body>

<div class="dashboard">

<header class="top-bar">

    <div class="brand">
        <img src="https://kairosglamdubai.com/images/Kairos-Logo.jpg" alt="Kairos Glam logo">
        <div>
            <h1>Kairos Glam</h1>
            <p id="todayDate"></p>
        </div>
    </div>

    <div class="top-actions">
        <button class="btn btn-ghost" id="refreshBtn" type="button" aria-label="Refresh bookings">
            ↻ <span class="label-long">Refresh</span>
        </button>
        <a class="btn btn-primary" href="/api/logout">
            Logout
        </a>
    </div>

</header>

<section class="stats-grid">

    <div class="stat-card accent">
        <h3>Total Bookings</h3>
        <h2 id="totalBookings">–</h2>
    </div>

    <div class="stat-card">
        <h3>Received Today</h3>
        <h2 id="todayBookings">–</h2>
    </div>

    <div class="stat-card">
        <h3>Upcoming</h3>
        <h2 id="upcomingBookings">–</h2>
    </div>

</section>

<section class="panel">

    <div class="panel-head">
        <h2>All Bookings</h2>
        <input class="search" id="search" type="search" placeholder="Search name, phone or email" aria-label="Search bookings">
    </div>

    <div class="table-wrapper">

    <table>

    <thead>

    <tr>
        <th>#</th>
        <th>Client</th>
        <th>Phone</th>
        <th>Services</th>
        <th>Appointment</th>
        <th>Message</th>
        <th>Received</th>
        <th></th>
    </tr>

    </thead>

    <tbody id="bookingRows">

    <tr class="empty-row">
    <td colspan="8" class="no-data">Loading bookings...</td>
    </tr>

    </tbody>

    </table>

    </div>

</section>

</div>

<script>

let allBookings = [];

document.getElementById("todayDate").textContent =
    new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

// Small helper to build elements with text only (never raw HTML).
function el(tag, className, text){

    const node = document.createElement(tag);

    if(className) node.className = className;
    if(text !== undefined) node.textContent = text;

    return node;

}

function cell(label, className){

    const td = el("td", className);
    td.dataset.label = label;

    return td;

}

function localDateKey(d){

    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

}

function formatDate(ymd){

    if(!ymd) return "-";

    const [y, m, d] = ymd.split("-").map(Number);

    return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

}

function formatTime(hm){

    if(!/^\d{2}:\d{2}/.test(hm || "")) return hm || "";

    const [h, m] = hm.split(":").map(Number);

    return ((h % 12) || 12) + ":" + String(m).padStart(2, "0") + (h < 12 ? " AM" : " PM");

}

function messageRow(text){

    const tr = el("tr", "empty-row");
    const td = el("td", "no-data", text);

    td.colSpan = 8;
    tr.appendChild(td);

    return tr;

}

function serviceCell(service){

    const td = cell("Services");
    const services = (service || "").split(",").map(s => s.trim()).filter(Boolean);

    if(services.length === 0){
        td.appendChild(el("span", "no-service", "No service"));
        return td;
    }

    const wrap = document.createElement("div");
    const tags = el("div", "service-tags");
    services.slice(0, 3).forEach(s => tags.appendChild(el("span", "tag", s)));
    wrap.appendChild(tags);

    const remaining = services.slice(3);

    if(remaining.length > 0){

        const extra = el("div", "extra-services");
        remaining.forEach(s => extra.appendChild(el("span", "tag", s)));

        const more = el("button", "tag more-tag", "+" + remaining.length + " more");
        more.type = "button";
        more.addEventListener("click", () => extra.classList.toggle("active"));

        tags.appendChild(more);
        wrap.appendChild(extra);

    }

    td.appendChild(wrap);

    return td;

}

function bookingRow(row, serial){

    const tr = document.createElement("tr");

    tr.appendChild(Object.assign(cell("#", "cell-serial"), { textContent: serial }));

    const client = cell("Client", "cell-contact");
    const clientWrap = document.createElement("div");
    clientWrap.appendChild(el("span", "cell-name", row.name));
    const mail = el("a", "cell-sub", row.email);
    mail.href = "mailto:" + row.email;
    clientWrap.appendChild(mail);
    client.appendChild(clientWrap);
    tr.appendChild(client);

    const phone = cell("Phone", "cell-contact");
    const tel = el("a", "", row.phone);
    tel.href = "tel:" + row.phone;
    phone.appendChild(tel);
    tr.appendChild(phone);

    tr.appendChild(serviceCell(row.service));

    const when = cell("Appointment");
    const whenWrap = document.createElement("div");
    whenWrap.appendChild(el("span", "when", formatDate(row.booking_date)));
    whenWrap.appendChild(el("span", "cell-sub", formatTime(row.booking_time)));
    when.appendChild(whenWrap);
    tr.appendChild(when);

    const message = cell("Message");
    message.appendChild(el("div", "message-box", row.message || "-"));
    tr.appendChild(message);

    const received = cell("Received");
    const createdAt = row.created_at ? new Date(row.created_at) : null;
    received.appendChild(el("span", "cell-sub",
        createdAt ? createdAt.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: 'numeric', minute: '2-digit' }) : "-"));
    tr.appendChild(received);

    const action = cell("");
    const deleteBtn = el("button", "delete-btn", "Delete");
    deleteBtn.type = "button";
    deleteBtn.setAttribute("aria-label", "Delete booking from " + row.name);
    deleteBtn.addEventListener("click", () => deleteBooking(row.id, deleteBtn));
    action.appendChild(deleteBtn);
    tr.appendChild(action);

    return tr;

}

function render(){

    const tbody = document.getElementById("bookingRows");
    const q = document.getElementById("search").value.trim().toLowerCase();

    const rows = q
        ? allBookings.filter(b => [b.name, b.phone, b.email].some(v => (v || "").toLowerCase().includes(q)))
        : allBookings;

    tbody.replaceChildren();

    if(rows.length === 0){
        tbody.appendChild(messageRow(q ? "No bookings match your search" : "No bookings yet"));
        return;
    }

    rows.forEach((row, i) => tbody.appendChild(bookingRow(row, i + 1)));

}

function updateStats(){

    const today = localDateKey(new Date());

    document.getElementById("totalBookings").textContent = allBookings.length;

    document.getElementById("todayBookings").textContent =
        allBookings.filter(b => b.created_at && localDateKey(new Date(b.created_at)) === today).length;

    document.getElementById("upcomingBookings").textContent =
        allBookings.filter(b => b.booking_date && b.booking_date >= today).length;

}

async function loadBookings(){

    const tbody = document.getElementById("bookingRows");

    try{

        const res = await fetch("/api/bookings", { cache: "no-store" });

        if(res.status === 401){
            window.location.href = "/admin/login.html";
            return;
        }

        if(!res.ok) throw new Error("HTTP " + res.status);

        allBookings = (await res.json()).bookings;

        updateStats();
        render();

    }catch(err){

        tbody.replaceChildren(messageRow("Could not load bookings. Please refresh the page."));

    }

}

async function deleteBooking(id, button){

    if(!confirm("Are you sure you want to delete this booking?")) return;

    button.disabled = true;

    try{

        const res = await fetch("/api/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id })
        });

        if(res.status === 401){
            window.location.href = "/admin/login.html";
            return;
        }

        if(!res.ok) throw new Error("HTTP " + res.status);

        loadBookings();

    }catch(err){

        alert("Could not delete this booking. Please try again.");
        button.disabled = false;

    }

}

document.getElementById("search").addEventListener("input", render);
document.getElementById("refreshBtn").addEventListener("click", loadBookings);

loadBookings();

</script>

</body>

</html>
