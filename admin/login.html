<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#faf5f3">

<title>Kairos Glam | Admin Login</title>

<!-- Favicons -->
  <link href="https://kairosglamdubai.com/images/favicon.png" rel="icon">
  <link href="https://kairosglamdubai.com/images/apple-touch-icon.png" rel="apple-touch-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

@font-face{
    font-family:'Kugile';
    src:url('/font/Kugile_Demo.ttf') format('truetype');
    font-display:swap;
}

:root{
    --brand:#b32025;
    --brand-light:#e0464b;
    --gold:#b8895a;
    --bg:#faf5f3;
    --card:#ffffff;
    --line:#ecdfdc;
    --text:#2b1b1c;
    --muted:#8a7472;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    -webkit-text-size-adjust:100%;
}

body{
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
    padding-top:max(24px, env(safe-area-inset-top));
    padding-bottom:max(24px, env(safe-area-inset-bottom));
    color:var(--text);
    background:
    radial-gradient(ellipse 80% 55% at 50% -10%, rgba(179,32,37,0.12), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 110%, rgba(184,137,90,0.12), transparent 70%),
    var(--bg);
    background-attachment:fixed;
}

/* =========================
   CARD
========================= */

.login-container{
    width:100%;
    max-width:400px;
}

.login-box{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:44px 32px 32px;
    box-shadow:0 24px 60px rgba(120,40,40,0.10), 0 2px 6px rgba(120,40,40,0.04);
    animation:fadeUp 0.6s ease;
}

/* Thin brand accent along the top edge */
.login-box::before{
    content:"";
    position:absolute;
    top:0;
    left:32px;
    right:32px;
    height:2px;
    border-radius:0 0 2px 2px;
    background:linear-gradient(90deg, transparent, var(--brand), transparent);
}

/* =========================
   BRAND
========================= */

.logo{
    width:76px;
    height:76px;
    margin:0 auto 18px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line), 0 8px 20px rgba(179,32,37,0.18);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.login-box h1{
    text-align:center;
    font-family:'Kugile', 'Poppins', serif;
    font-weight:400;
    font-size:32px;
    letter-spacing:0.5px;
    color:var(--brand);
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:30px;
}

/* =========================
   ERROR
========================= */

.error{
    background:#fdeeee;
    border:1px solid #f3c6c7;
    color:#9b1c20;
    padding:12px 14px;
    border-radius:12px;
    margin-bottom:18px;
    text-align:center;
    font-size:14px;
}

.error[hidden]{
    display:none;
}

/* =========================
   INPUTS
========================= */

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#4a3536;
    font-size:13px;
    font-weight:500;
}

.input-wrap{
    position:relative;
}

.input-group input{
    width:100%;
    height:52px;
    border-radius:14px;
    padding:0 16px;
    /* 16px stops iPhones from zooming in when the field is tapped */
    font-size:16px;
    font-family:inherit;
    color:var(--text);
    background:#fcf9f8;
    border:1px solid var(--line);
    outline:none;
    transition:border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

.input-group input::placeholder{
    color:#b3a3a1;
}

.input-group input:focus{
    border-color:var(--brand-light);
    box-shadow:0 0 0 4px rgba(224,70,75,0.15);
    background:#fff;
}

.input-wrap input{
    padding-right:64px;
}

.toggle-password{
    position:absolute;
    top:50%;
    right:4px;
    transform:translateY(-50%);
    height:44px;
    min-width:52px;
    padding:0 10px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:var(--brand);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
}

.toggle-password:hover,
.toggle-password:focus-visible{
    background:rgba(179,32,37,0.07);
    outline:none;
}

/* =========================
   BUTTON
========================= */

.login-btn{
    width:100%;
    height:54px;
    margin-top:8px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.3px;
    color:#fff;
    background:linear-gradient(135deg, var(--brand), var(--brand-light));
    box-shadow:0 10px 24px rgba(179,32,37,0.25);
    transition:transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(179,32,37,0.32);
}

.login-btn:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
}

.login-btn:disabled{
    opacity:0.7;
    cursor:wait;
    transform:none;
}

/* =========================
   FOOTER
========================= */

.footer-text{
    text-align:center;
    margin-top:24px;
    font-size:12px;
    color:var(--muted);
}

.footer-text a{
    color:var(--brand);
    text-decoration:none;
}

/* =========================
   ANIMATION
========================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(24px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media (prefers-reduced-motion: reduce){

    .login-box{
        animation:none;
    }

    .login-btn{
        transition:none;
    }

}

/* =========================
   PHONES
========================= */

@media(max-width:480px){

    body{
        align-items:flex-start;
        padding-top:max(48px, env(safe-area-inset-top));
    }

    .login-box{
        padding:36px 20px 24px;
        border-radius:20px;
    }

    .login-box::before{
        left:20px;
        right:20px;
    }

    .logo{
        width:68px;
        height:68px;
    }

    .login-box h1{
        font-size:28px;
    }

    .subtitle{
        font-size:12px;
        margin-bottom:24px;
    }

}

</style>

</head>

<body>

<main class="login-container">

    <div class="login-box">

        <!-- BRAND -->

        <div class="logo">
            <img src="https://kairosglamdubai.com/images/Kairos-Logo.jpg" alt="Kairos Glam logo">
        </div>

        <h1>Kairos Glam</h1>

        <div class="subtitle">
            Admin Dashboard
        </div>

        <!-- ERROR -->

        <div class="error" id="loginError" role="alert" hidden></div>

        <!-- FORM -->

        <form id="loginForm" novalidate>

            <div class="input-group">

                <label for="username">Username</label>

                <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                required>

            </div>

            <div class="input-group">

                <label for="password">Password</label>

                <div class="input-wrap">

                    <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

                    <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                    aria-pressed="false">

                        Show

                    </button>

                </div>

            </div>

            <button
            type="submit"
            class="login-btn"
            id="loginBtn">

                Sign In

            </button>

        </form>

        <!-- FOOTER -->

        <div class="footer-text">
            © <span id="year"></span> Kairos Glam · <a href="/">Back to website</a>
        </div>

    </div>

</main>

<script>

document.getElementById("year").textContent = new Date().getFullYear();

const passwordInput = document.getElementById("password");
const toggleBtn = document.getElementById("togglePassword");

toggleBtn.addEventListener("click", function(){

    const show = passwordInput.type === "password";

    passwordInput.type = show ? "text" : "password";
    toggleBtn.textContent = show ? "Hide" : "Show";
    toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    toggleBtn.setAttribute("aria-pressed", String(show));

});

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const errorBox = document.getElementById("loginError");
    const button = document.getElementById("loginBtn");
    const username = document.getElementById("username").value.trim();
    const password = passwordInput.value;

    if(!username || !password){
        errorBox.textContent = "Please enter your username and password.";
        errorBox.hidden = false;
        return;
    }

    errorBox.hidden = true;
    button.disabled = true;
    button.textContent = "Signing in...";

    try{

        const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
        });

        if(res.ok){
            window.location.href = "/admin/";
            return;
        }

        const data = await res.json().catch(() => ({}));
        errorBox.textContent = data.error || "Login failed. Please try again.";

    }catch(err){

        errorBox.textContent = "Network error. Please try again.";

    }

    errorBox.hidden = false;
    button.disabled = false;
    button.textContent = "Sign In";

});

</script>

</body>

</html>
